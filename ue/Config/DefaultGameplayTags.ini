[/Script/GameplayTags.GameplayTagsSettings]
; 余火协议 —— GameplayTag 登记表
; 所有 Tag 必须在这里声明，RobotTags 命名空间里的取值才能生效。
; 命名规范：大类.子类.细分，最多三层。

; ── 机体分类 ──
+GameplayTagList=(Tag="Chassis.Light",DevComment="轻型侦察：质量最低、散热最好、供电上限最低")
+GameplayTagList=(Tag="Chassis.Medium",DevComment="中型通用：三项均衡")
+GameplayTagList=(Tag="Chassis.Heavy",DevComment="重型攻坚：质量最高、火力最强、散热最差")

; ── 部位 ──
; 与 Blender 导出的骨骼命名对应关系见 PartMapData 资产
+GameplayTagList=(Tag="Part.Core",DevComment="核心：摧毁即死亡，掉落价值最高")
+GameplayTagList=(Tag="Part.Torso",DevComment="躯干：纯伤害承受面，不掉落")
+GameplayTagList=(Tag="Part.Arm.L",DevComment="左武器臂：摧毁后该臂武器失效")
+GameplayTagList=(Tag="Part.Arm.R",DevComment="右武器臂")
+GameplayTagList=(Tag="Part.Leg.L",DevComment="左推进器：摧毁后移动降速")
+GameplayTagList=(Tag="Part.Leg.R",DevComment="右推进器")

; ── 状态 ──
+GameplayTagList=(Tag="State.Overheated",DevComment="过热锁定：武器禁用，热量快速下降")
+GameplayTagList=(Tag="State.Disabled",DevComment="瘫痪：功能部位全毁但核心存活，可交互")
+GameplayTagList=(Tag="State.Repairable",DevComment="可修复窗口：具名敌人可被招募")

; ── 模块类型 ──
+GameplayTagList=(Tag="Module.Type.Head",DevComment="头部模块")
+GameplayTagList=(Tag="Module.Type.Core",DevComment="核心模块")
+GameplayTagList=(Tag="Module.Type.Arm.Melee",DevComment="近战武器臂")
+GameplayTagList=(Tag="Module.Type.Arm.Ranged",DevComment="远程武器臂")
+GameplayTagList=(Tag="Module.Type.Arm.Utility",DevComment="功能臂（盾、钩索、焊枪）")
+GameplayTagList=(Tag="Module.Type.Thruster",DevComment="推进器 / 底盘")
+GameplayTagList=(Tag="Module.Type.Backpack",DevComment="背包")
+GameplayTagList=(Tag="Module.Type.Auxiliary",DevComment="辅助模块")

; ── 移动能力（由模块授予，移动系统查询） ──
+GameplayTagList=(Tag="Traversal.Dash",DevComment="空中冲刺")
+GameplayTagList=(Tag="Traversal.Grapple",DevComment="钩索牵引")
+GameplayTagList=(Tag="Traversal.Climb.Magnetic",DevComment="磁吸攀爬：重型机的核心卖点")
+GameplayTagList=(Tag="Traversal.Jump.Double",DevComment="二段跳")

; ── 技能 ──
+GameplayTagList=(Tag="Ability.Dash",DevComment="冲刺：消耗电力 + 产生热量")
+GameplayTagList=(Tag="Ability.Fire",DevComment="射击：消耗电力 + 产生热量")
+GameplayTagList=(Tag="Ability.Repair",DevComment="修复：用于可招募的具名敌人")
