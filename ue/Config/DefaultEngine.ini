; ⚠️⚠️ 这里**刻意不做任何渲染设置覆盖**，全部使用 UE5 默认值。
;
; 排查全黑的全过程（务必读完再改，这些都是花了很多轮才搞清楚的）：
;
; 【真因】脚本 spawn 出来的 StaticMeshActor，组件 Mobility 默认是 Static。
;        Static 网格体靠**烘焙光照贴图**照明，而这个关卡从未烘焙过
;        → 网格体拿不到光照 → 渲染成纯黑。
;        修法：把 52 个网格体全部改成 Movable（见 Scripts/fix_static_mobility.py）。
;
; 【验证方法】编辑器视口切换显示模式：
;        Unlit（无光照）→ 网格体完整可见  ✅ 几何体管线正常
;        Wireframe（线框）→ 网格体完整可见  ✅ 几何体管线正常
;        Lit（光照）→ 完全不可见  ❌ 光照计算输出全黑
;        **这个对比是定位问题的关键，比在配置里盲试有效得多。**
;
; 【踩过的坑】
;  1. 重复键：同一段里写两次同名 CVar，后一个覆盖前一个，
;     导致"以为关了其实开着"。改完务必检查：
;       grep -oE "^[a-zA-Z]+\.[A-Za-z.]+" DefaultEngine.ini | sort | uniq -c
;  2. 用 DefaultGraphicsRHI 强制图形 API 会覆盖命令行参数，
;     让 -dx11 之类的对照测试失效。
;  3. 截图做证据前先确认截图工具本身在工作：
;     -unattended 模式下编辑器根本不渲染，截出来必然是黑的（21KB）；
;     正常有内容的图明显更大（150KB+）。
;
; 【结论】先用纯默认配置确认能正常显示，要开什么特性再逐项加回来。

